name: Deploy production

# The production environment's required reviewers are configured in GitHub.
on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Full ghcr.io digest reference successfully deployed to staging"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - name: Verify a successful staging deployment in history
        id: verify
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          TARGET: ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}
          IMAGE_REF: ${{ inputs.digest }}
        run: |
          if [[ ! "$IMAGE_REF" =~ ^ghcr\.io/ruoshui-git/temple_inventory@sha256:[0-9a-f]{64}$ ]]; then
            echo 'Expected one immutable ghcr.io/ruoshui-git/temple_inventory digest.' >&2
            exit 1
          fi
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          status=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ConnectTimeout=15 "$TARGET" staging status)
          # A bootstrap, refresh, current-image record, or failed deployment
          # does not count. deploy.sh writes this event only after health passes.
          if ! awk -v image="$IMAGE_REF" \
            'NF == 3 && $2 == "deployed" && $3 == image {found = 1} END {exit !found}' \
            <<<"$status"; then
            echo 'This digest has no successful staging deployment in history.' >&2
            exit 1
          fi
          printf 'digest=%s\n' "$IMAGE_REF" >>"$GITHUB_OUTPUT"

  deploy:
    needs: verify-staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://kufang.org
    steps:
      - name: Deploy the verified digest over SSH
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          TARGET: ${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}
          IMAGE_REF: ${{ needs.verify-staging.outputs.digest }}
        run: |
          if [[ ! "$IMAGE_REF" =~ ^ghcr\.io/ruoshui-git/temple_inventory@sha256:[0-9a-f]{64}$ ]]; then
            echo 'Expected one immutable ghcr.io/ruoshui-git/temple_inventory digest.' >&2
            exit 1
          fi
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ConnectTimeout=15 "$TARGET" \
            production deploy "$IMAGE_REF"
      - name: Public health check
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 10 \
            --retry-all-errors --max-time 30 https://kufang.org/api/method/ping \
            | python3 -c 'import json, sys; sys.exit(json.load(sys.stdin).get("message") != "pong")'
