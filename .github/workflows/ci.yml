name: CI

# Runs on every branch push except main; the Sample workflow calls it for main so
# a main commit is tested once, then built and deployed.
on:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.14.10 check
      - run: uvx ruff@0.14.10 format --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm type-check
      - run: pnpm test
      # vite build needs a bench layout; the image build in sample.yml runs it.

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis-cache:
        image: redis:alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:alpine
        ports: ["11000:6379"]
    steps:
      - uses: actions/checkout@v5
        with:
          path: temple_inventory
      - name: Load framework versions
        run: grep -v '^#' temple_inventory/deploy/versions.env >>"$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mariadb-client redis-tools
      - name: Install bench
        run: |
          corepack enable pnpm
          npm install -g yarn
          pip install frappe-bench
      - name: Create bench
        run: |
          bench init --frappe-branch "$FRAPPE_VERSION" --skip-redis-config-generation --skip-assets \
            --no-procfile --no-backups ~/frappe-bench
          cd ~/frappe-bench
          bench get-app --branch "$ERPNEXT_VERSION" --skip-assets erpnext https://github.com/frappe/erpnext
          bench get-app --skip-assets temple_inventory "$GITHUB_WORKSPACE/temple_inventory"
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000
      - name: Create site
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site ci.localhost --db-root-password root --admin-password admin \
            --mariadb-user-host-login-scope=% --install-app erpnext --install-app temple_inventory
          bench --site ci.localhost set-config developer_mode 1
          bench --site ci.localhost set-config temple_inventory_sample_site 1
      # The same company setup and sample data as development.localhost, which the
      # suite runs against locally.
      - name: Install sample data
        working-directory: /home/runner/frappe-bench
        run: bench --site ci.localhost execute temple_inventory.sample_install.prepare_development_sample_site
      - name: Native inventory tests
        working-directory: /home/runner/frappe-bench
        run: bench --site ci.localhost execute temple_inventory.tests.test_native_inventory.run
