name: Promote staging

# Promote the image sample already runs; no image is rebuilt here.
on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Full ghcr.io digest reference (blank uses sample's current image)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: staging
      url: https://staging.kufang.online
    steps:
      - name: Refresh production data and deploy the sample image
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          TARGET: ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}
          REQUESTED_DIGEST: ${{ inputs.digest }}
        run: |
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          remote() {
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 -o ConnectTimeout=15 "$TARGET" "$@"
          }
          image=$REQUESTED_DIGEST
          if [[ -z "$image" ]]; then
            status=$(remote sample status)
            image=$(awk '$1 == "current:" && NF == 2 {print $2}' <<<"$status")
          fi
          if [[ ! "$image" =~ ^ghcr\.io/ruoshui-git/temple_inventory@sha256:[0-9a-f]{64}$ ]]; then
            echo 'Expected one immutable ghcr.io/ruoshui-git/temple_inventory digest.' >&2
            exit 1
          fi
          remote staging refresh
          remote staging deploy "$image"
      - name: Public health check
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 10 \
            --retry-all-errors --max-time 30 \
            https://staging.kufang.online/api/method/ping \
            | python3 -c 'import json, sys; sys.exit(json.load(sys.stdin).get("message") != "pong")'
