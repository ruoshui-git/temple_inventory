name: Sample

# Every push to main: test, build one immutable image, deploy it to the sample
# site. Deploys are serialized; a newer commit waiting behind a running deploy
# replaces any older pending one, so sample converges on the latest main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/ruoshui-git/temple_inventory

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - name: Load framework versions
        run: grep -v '^#' deploy/versions.env >>"$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Containerfile
          push: true
          build-args: |
            FRAPPE_VERSION=${{ env.FRAPPE_VERSION }}
            ERPNEXT_VERSION=${{ env.ERPNEXT_VERSION }}
            REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: sample
      url: https://sample.kufang.online
    concurrency:
      group: deploy-sample
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SAMPLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SAMPLE_SSH_KNOWN_HOSTS }}
          TARGET: ${{ secrets.SAMPLE_SSH_USER }}@${{ secrets.SAMPLE_SSH_HOST }}
          IMAGE_REF: ${{ needs.image.outputs.ref }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          ssh -o BatchMode=yes -o ServerAliveInterval=30 "$TARGET" deploy "$IMAGE_REF"
      - name: Public health check
        run: curl -fsS --retry 6 --retry-delay 10 https://sample.kufang.online/api/method/ping | grep -q pong
