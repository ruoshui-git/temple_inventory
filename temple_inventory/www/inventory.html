<!DOCTYPE html>
<html>
<head>
    <title>Temple Inventory</title>
</head>
<body>
    <h1>Temple Inventory</h1>

    <p>Hello from the custom app!</p>

    <button onclick="testBackend()">
        Test Backend
    </button>

    <p id="result"></p>

    <script>
        async function testBackend() {
            const response = await fetch(
                "/api/method/temple_inventory.api.hello"
            );

            const data = await response.json();

            document.getElementById("result").textContent =
                data.message.message;
        }
    </script>
</body>
</html>
